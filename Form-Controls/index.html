<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!-- write your html here-->
        <!-- 
          try writing out the requirements first as comments
        this will also help you fill in your PR message later-->
  <!-- 1. Customer Name (at least 2 non-space characters via regex) -->
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" pattern=".*\S.*\S.*" required>

  <!-- 2. Customer Email -->
  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required>

  <!-- 3. T-shirt Colour (3 options via select) -->
  <label for="colour">T-shirt Colour:</label>
  <select id="colour" name="colour" required>
    <option value="">--Select a colour--</option>
    <option value="red">Red</option>
    <option value="blue">Blue</option>
    <option value="black">Black</option>
  </select>

  <!-- 4. T-shirt Size (6 options: XS, S, M, L, XL, XXL) -->
  <label for="size">T-shirt Size:</label>
  <select id="size" name="size" required>
    <option value="">--Select a size--</option>
    <option value="XS">XS</option>
    <option value="S">S</option>
    <option value="M">M</option>
    <option value="L">L</option>
    <option value="XL">XL</option>
    <option value="XXL">XXL</option>
  </select>
  <button type="submit">Submit Order</button>
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <p>By HOMEWORK SOLUTION</p>
    </footer>
  </body>
</html>
